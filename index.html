<!doctype html>
<html lang="en" class="umm-no-js">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- The two weights that paint above the fold. Preloaded so the display
         face is resolved before first paint instead of after CSS parse. -->
    <link
      rel="preload"
      href="/fonts/Mosvita-Medium.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/Mosvita-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Customer Experience Design Services | UMM — Unified Modern Minds</title>
    <meta
      name="description"
      content="Improve customer journeys with UMM's experience design services: CX strategy, research, service design, UX design and ongoing optimisation."
    />
    <meta name="author" content="Unified Modern Minds" />
    <meta name="theme-color" content="#eeeeee" />
    <meta property="og:title" content="Customer Experience Design Services | UMM Digital" />
    <meta
      property="og:description"
      content="Research, map, design and improve connected customer experiences with UMM Digital."
    />
    <meta property="og:type" content="website" />
    <script>
      // Removed before first paint so reveal animations only apply when JS runs.
      document.documentElement.classList.remove('umm-no-js')
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
